name: twinkly-dimmer
components:
  - id: main
    capabilities:
      - id: switch
        version: 1
        default: true
      - id: switchLevel
        version: 1
      - id: refresh
        version: 1
      - id: voicetiger23642.twinklyEffect
        version: 1
    categories:
      - name: Light

preferences:
  - name: ipAddress
    title: Device IP Address
    description: Optional manual IP override; leave at 0.0.0.0 for discovery
    required: false
    preferenceType: string
    definition:
      stringType: text
      default: 0.0.0.0
      pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$"
      minLength: 7
      maxLength: 15
  - name: pollInterval
    title: Polling Interval (seconds)
    description: How often to read the device state
    required: false
    preferenceType: integer
    definition:
      minimum: 30
      maximum: 3600
      default: 60
